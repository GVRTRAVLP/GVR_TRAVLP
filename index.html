```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GVR_TRAVLP Weekend Trips</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

header{
display:flex;
align-items:center;
gap:15px;
}

.logo{
width:70px;
height:70px;
border-radius:10px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
margin-top:20px;
}

.tripCard img{
width:100%;
height:200px;
object-fit:cover;
border-radius:8px;
}

button{
background:#ff7a18;
color:white;
border:none;
padding:10px 15px;
border-radius:6px;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:0.9;
}

.small{
color:#666;
font-size:14px;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:8px;
margin-bottom:10px;
border-radius:6px;
border:1px solid #ccc;
}

.hidden{
display:none;
}

.steps{
display:flex;
gap:5px;
margin-bottom:10px;
}

.step{
flex:1;
padding:8px;
text-align:center;
background:#eee;
border-radius:6px;
font-weight:bold;
}

.step.active{
background:#ff7a18;
color:white;
}

.layout{
display:grid;
grid-template-columns:1fr 350px;
gap:20px;
}

@media(max-width:900px){
.layout{
grid-template-columns:1fr;
}
}

</style>
</head>


<body>

<div class="container">

<header>
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Hogenakkal_Falls_Close.jpg/640px-Hogenakkal_Falls_Close.jpg" class="logo">

<div>
<h2>GVR_TRAVLP — Weekend Traveller</h2>
<div class="small">Bangalore Weekend Trips · @gvryalla</div>
</div>

</header>



<div class="layout">

<div class="card" id="tripList"></div>


<div class="card">

<div class="steps">
<div class="step active" id="s1">1 Select</div>
<div class="step" id="s2">2 Details</div>
<div class="step" id="s3">3 Pay</div>
<div class="step" id="s4">4 Confirm</div>
</div>



<div id="step1">

<label>Choose Trip</label>
<select id="selectTrip"></select>

<label>Choose Weekend</label>
<select id="selectDate"></select>

<button onclick="goToDetails()">Proceed</button>

</div>



<form id="step2" class="hidden" onsubmit="event.preventDefault();goToPay();">

<input id="name" placeholder="Full Name" required>

<input id="mobile" placeholder="Mobile Number" required>

<input id="age" placeholder="Age" required>

<select id="gender" required>
<option value="">Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<button type="submit">Proceed to Pay</button>

</form>



<div id="step3" class="hidden">

<p>Pay using UPI</p>

<p><b>UPI ID : 27722222@ybl</b></p>

<input id="txn" placeholder="Transaction ID">

<button onclick="confirmPaid()">I Have Paid</button>

</div>



<div id="step4" class="hidden">

<h3>Booking Submitted</h3>

<textarea id="summary" rows="7"></textarea>

<button onclick="copySummary()">Copy Details</button>

</div>

</div>

</div>

</div>



<script>

const tripsData = [

{
name:"Hogenakkal Falls One Day Trip",
price:"₹1500 Per Person",
details:"Morning Breakfast + Afternoon Lunch + Travel + Photos & Videos",
place:"Hogenakkal Falls",
image:"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Hogenakkal_Falls_Close.jpg/640px-Hogenakkal_Falls_Close.jpg"
}

];


function renderTrips(){

const box=document.getElementById("tripList");

tripsData.forEach(t=>{

box.innerHTML+=`

<div class="tripCard">

<img src="${t.image}">

<h3>${t.name}</h3>

<p class="small">${t.details}</p>

<p><b>${t.price}</b></p>

<button onclick="selectTrip('${t.place}')">Book Now</button>

</div>

`;

});

}



function populateSelect(){

const sel=document.getElementById("selectTrip");

tripsData.forEach(t=>{

sel.innerHTML+=`<option>${t.place}</option>`;

});

}



function populateDates(){

const sel=document.getElementById("selectDate");

let d=new Date();

for(let i=0;i<60;i++){

if(d.getDay()==0||d.getDay()==6){

sel.innerHTML+=`<option>${d.toDateString()}</option>`;

}

d.setDate(d.getDate()+1);

}

}



function selectTrip(t){

document.getElementById("selectTrip").value=t;

goToDetails();

}



function goToDetails(){

step(1,2);

}



function goToPay(){

step(2,3);

}



function confirmPaid(){

const s=document.getElementById("summary");

s.value=`Trip: ${selectTrip.value}
Date: ${selectDate.value}
Name: ${name.value}
Mobile: ${mobile.value}
Age/Gender: ${age.value}/${gender.value}
Transaction: ${txn.value}`;

step(3,4);

}



function step(a,b){

document.getElementById(`step${a}`).classList.add("hidden");

document.getElementById(`step${b}`).classList.remove("hidden");

document.getElementById(`s${a}`).classList.remove("active");

document.getElementById(`s${b}`).classList.add("active");

}



function copySummary(){

navigator.clipboard.writeText(summary.value);

alert("Copied");

}



document.addEventListener("DOMContentLoaded",()=>{

renderTrips();

populateSelect();

populateDates();

});

</script>

</body>
</html>
```
