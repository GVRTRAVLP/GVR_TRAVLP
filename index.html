
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GVR_TRAVLP | Hogenakkal Falls Trip</title>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0;}
.container{max-width:1100px;margin:auto;padding:20px;}
header{display:flex;align-items:center;gap:15px;justify-content:space-between;}
.logo{width:70px;height:70px;border-radius:10px;}
.header-left{display:flex;align-items:center;gap:15px;}
.insta{background:#E1306C;color:white;padding:8px 14px;border-radius:6px;text-decoration:none;font-weight:bold;}
.layout{display:grid;grid-template-columns:1fr 350px;gap:20px;margin-top:20px;}
.card{background:white;padding:20px;border-radius:10px;box-shadow:0 6px 15px rgba(0,0,0,0.1);}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:15px;}
.gallery img{width:100%;height:180px;object-fit:cover;border-radius:8px;}
button{background:#ff7a18;border:none;color:white;padding:10px;border-radius:6px;cursor:pointer;margin-top:10px;width:100%;}
.small{font-size:14px;color:#666;}
input,select,textarea{width:100%;padding:10px;margin-top:8px;margin-bottom:10px;border-radius:6px;border:1px solid #ccc;}
.hidden{display:none;}
.steps{display:flex;gap:5px;margin-bottom:10px;}
.step{flex:1;padding:8px;text-align:center;background:#eee;border-radius:6px;font-weight:bold;}
.step.active{background:#ff7a18;color:white;}
</style>
</head>

<body>

<div class="container">

<header>
<div class="header-left">
<img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Hogenakkal_Falls_Close.jpg/640px-Hogenakkal_Falls_Close.jpg">
<div>
<h2>GVR_TRAVLP — Weekend Traveller</h2>
<div class="small">Bangalore Weekend Trips</div>
</div>
</div>

<a class="insta" href="https://www.instagram.com/gvr_travlp?igsh=MTVuYnB6cnk5YTNxYQ==" target="_blank">Instagram @gvr_travlp</a>
</header>


<div class="layout">

<div class="card">

<h3>Hogenakkal Falls One Day Trip</h3>

<div class="gallery">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Hogenakkal_Falls_Close.jpg/640px-Hogenakkal_Falls_Close.jpg">
<img src="https://upload.wikimedia.org/wikipedia/commons/2/21/Hogenakkal_Falls_Tamil_Nadu.jpg">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/5b/Hogenakkal_Falls_boat.jpg">
<img src="https://upload.wikimedia.org/wikipedia/commons/3/32/Hogenakkal_waterfalls_view.jpg">
</div>

<p class="small">Morning Breakfast + Afternoon Lunch + Travel + Beautiful Photos & Videos</p>
<p><b>Price: ₹1500 per person</b></p>

</div>


<div class="card">

<div class="steps">
<div class="step active" id="s1">1 Select</div>
<div class="step" id="s2">2 Details</div>
<div class="step" id="s3">3 Seats</div>
<div class="step" id="s4">4 Confirm</div>
</div>

<div id="step1">
<label>Select Date</label>
<select id="selectDate"></select>
<button onclick="goStep(1,2)">Next</button>
</div>

<div id="step2" class="hidden">
<input id="name" placeholder="Full Name">
<input id="mobile" placeholder="Mobile Number">
<input id="age" placeholder="Age">
<select id="gender">
<option value="">Gender</option>
<option>Male</option>
<option>Female</option>
</select>
<button onclick="goStep(2,3)">Next</button>
</div>

<div id="step3" class="hidden">
<label>Select Seats (7 available)</label>
<select id="seats">
<option>1 Seat</option>
<option>2 Seats</option>
<option>3 Seats</option>
<option>4 Seats</option>
<option>5 Seats</option>
<option>6 Seats</option>
<option>7 Seats</option>
</select>
<p><b>Price: ₹1500 per person</b></p>
<button onclick="confirmBooking()">Confirm Booking</button>
</div>

<div id="step4" class="hidden">
<h3>Booking Ready</h3>
<textarea id="summary" rows="7"></textarea>
<button onclick="sendWhatsApp()">Send via WhatsApp</button>
</div>

</div>

</div>
</div>


<script>

function populateDates(){
const sel=document.getElementById("selectDate");
let d=new Date();
for(let i=0;i<60;i++){
 if(d.getDay()==0||d.getDay()==6){
  sel.innerHTML+=`<option>${d.toDateString()}</option>`;
 }
 d.setDate(d.getDate()+1);
}
}

function goStep(a,b){
document.getElementById("step"+a).classList.add("hidden");
document.getElementById("step"+b).classList.remove("hidden");
document.getElementById("s"+a).classList.remove("active");
document.getElementById("s"+b).classList.add("active");
}

function confirmBooking(){

let seats=document.getElementById("seats").value;
let count=parseInt(seats);
let total=count*1500;

let text=`Trip: Hogenakkal Falls
Date: ${selectDate.value}
Name: ${name.value}
Mobile: ${mobile.value}
Age/Gender: ${age.value}/${gender.value}
Seats: ${seats}
Total Price: ₹${total}`;

document.getElementById("summary").value=text;

goStep(3,4);
}

function sendWhatsApp(){
let msg=encodeURIComponent(summary.value);
let phone="917799399932";
window.open(`https://wa.me/${phone}?text=${msg}`);
}

populateDates();

</script>

</body>
</html>
